<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OmniScript Data</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="scope">
    <label class="field">
      <span>OmniScript</span>
      <select id="target"></select>
    </label>
    <button id="advanced" class="switch" role="switch" aria-checked="false" title="Show the less common controls: Nested here; change navigation, payload comparison and Reveal element on Data; the error, slow-call and non-OmniStudio filters on Remote actions; four extra options on Structure. Turning it off puts them back to their defaults."><span class="switch-track"><span class="switch-knob"></span></span><span>Advanced</span></button>
    <label class="field checkbox mask-switch" title="Replace strings and numbers with placeholders in everything that leaves the panel: Copy JSON, Save file, the per-row copy value button, the Structure value copy and the Remote actions export. Structure and keys are kept. Not remembered between sessions.">
      <input id="mask-values" type="checkbox" />
      <span>Mask values</span>
    </label>
    <button id="rescan" class="icon-btn tiny" title="Look for frames and OmniScripts again">Rescan</button>
    <button id="help" class="icon-btn tiny help-btn" title="What this tab does" aria-expanded="false">?</button>
    <div class="scope-extra adv">
      <label class="field">
        <span>Frame</span>
        <select id="frame" title="Limit the list to one document, or leave on All frames"></select>
      </label>
      <label class="field checkbox" title="Child element components expose the same properties as their OmniScript. Off by default.">
        <input id="show-nested" type="checkbox" />
        <span>Nested</span>
      </label>
    </div>
  </header>

  <nav class="tabstrip" role="tablist">
    <button id="tab-data" class="tab is-on" role="tab" aria-selected="true">Data</button>
    <button id="tab-structure" class="tab" role="tab" aria-selected="false">Structure</button>
    <button id="tab-actions" class="tab" role="tab" aria-selected="false">
      Remote actions <span id="actions-count" class="badge" hidden>0</span>
    </button>
  </nav>

  <!-- ------------------------------------------------------ Data tab -->
  <section id="view-data" class="view" role="tabpanel">
    <header class="toolbar">
      <div class="bar">
        <button id="refresh" class="icon-btn" title="Read the property now">Refresh</button>

        <label class="field">
          <span>Property</span>
          <input id="prop" type="text" value="jsonDataStr" spellcheck="false" size="12" />
        </label>

        <label class="field checkbox" title="Re-read every second. Untick for manual mode: the data is read only when you press Refresh.">
          <input id="live" type="checkbox" checked />
          <span>Auto-refresh</span>
        </label>
      </div>

      <div class="bar">
        <div class="seg" role="group" aria-label="View">
          <button id="view-tree" class="seg-btn is-on">Tree</button>
          <button id="view-raw" class="seg-btn">Raw</button>
        </div>

        <input id="filter" type="search" placeholder="Filter keys and values" spellcheck="false" />

        <button id="expand" class="icon-btn" title="Expand everything">Expand all</button>
        <button id="collapse" class="icon-btn" title="Collapse to the top level">Collapse all</button>
        <button id="copy" class="icon-btn">Copy JSON</button>
        <label class="field checkbox" hidden>
          <input id="raw-wrap" type="checkbox" />
          <span>Wrap</span>
        </label>
        <button id="download" class="icon-btn" title="Writes the payload to a file. It may contain org data — handle it accordingly.">Save file</button>
        <button id="select" class="icon-btn adv" title="Reveal the element in Elements and expose it as $omni">Reveal element</button>
      </div>

      <div class="bar adv">
        <span class="bar-label">Changes</span>
        <label class="field checkbox" title="Show only the values that changed since the marks were cleared">
          <input id="changed-only" type="checkbox" />
          <span>Changed only</span>
        </label>
        <button id="prev-change" class="icon-btn" title="Jump to the previous marked change">◀ Prev</button>
        <button id="next-change" class="icon-btn" title="Jump to the next marked change">Next ▶</button>
        <span id="change-count" class="bar-note">none marked</span>
        <button id="clear-changes" class="icon-btn" title="Forget which values changed">Clear marks</button>
        <button id="compare-toggle" class="icon-btn" title="Diff two of the last payloads read: what changed between them">Compare payloads</button>
      </div>
    </header>

    <div id="watch" class="bar watch" hidden></div>
    <div id="compare-panel" class="compare" hidden></div>

    <main id="viewport" class="viewport" tabindex="0"></main>
  </section>

  <!-- ------------------------------------------------- Structure tab -->
  <section id="view-structure" class="view" role="tabpanel" hidden>
    <header class="toolbar">
      <div class="bar">
        <button id="struct-refresh" class="icon-btn">Refresh</button>
        <button id="struct-current" class="icon-btn" title="Select and scroll to the step the OmniScript is on now">Current step</button>
        <label class="field checkbox adv" title="Keep the current step selected as the script moves on">
          <input id="struct-follow" type="checkbox" />
          <span>Follow step</span>
        </label>

        <label class="field">
          <span>Definition</span>
          <input id="struct-prop" type="text" value="jsonDef" spellcheck="false" size="10" />
        </label>

        <input id="struct-filter" type="search" placeholder="Filter by name, type, label or label text" spellcheck="false" />

        <button id="struct-expand" class="icon-btn" title="Expand every section">Expand all</button>
        <button id="struct-collapse" class="icon-btn" title="Collapse every section">Collapse all</button>

        <label class="field checkbox">
          <input id="struct-actions-only" type="checkbox" />
          <span>Actions only</span>
        </label>

        <label class="field checkbox adv" title="Fold each step once the script has passed it, so the area you are working in stays in view. Opens again if the script returns to it.">
          <input id="struct-autocollapse" type="checkbox" />
          <span>Collapse done steps</span>
        </label>

        <label class="field checkbox adv" title="Outline the hovered element's component on the inspected page (best effort: needs the element's lwcId from the definition)">
          <input id="struct-hover" type="checkbox" />
          <span>Highlight on hover</span>
        </label>

        <label class="field checkbox adv" title="Hide elements that are not shown right now: their show rules are false, or a parent is hidden">
          <input id="struct-visible-only" type="checkbox" />
          <span>Visible only</span>
        </label>
      </div>
    </header>

    <div class="split">
      <div id="struct-list" class="log-list"></div>
      <div id="struct-detail" class="log-detail"></div>
    </div>
  </section>

  <!-- --------------------------------------------- Remote actions tab -->
  <section id="view-actions" class="view" role="tabpanel" hidden>
    <header class="toolbar">
      <div class="bar">
        <button id="log-record" class="icon-btn is-on" title="Stop or resume capturing">Recording</button>
        <button id="log-clear" class="icon-btn">Clear</button>

        <input id="log-filter" type="search" placeholder="Filter by class, method or URL" spellcheck="false" />

        <label class="field checkbox adv" title="Show only calls that failed, for any reason the row marks as failed">
          <input id="log-errors-only" type="checkbox" />
          <span>Errors only</span>
        </label>

        <label class="field adv" title="Show only calls that took at least this many milliseconds. 0 turns it off.">
          <span>Slower than</span>
          <input id="log-slow" type="number" min="0" step="100" placeholder="0" size="5" class="narrow" />
          <span>ms</span>
        </label>

        <label class="field checkbox adv">
          <input id="log-only-omni" type="checkbox" checked />
          <span>OmniStudio only</span>
        </label>

        <label class="field checkbox">
          <input id="log-preserve" type="checkbox" checked />
          <span>Preserve on reload</span>
        </label>

        <button id="log-export" class="icon-btn" title="Writes the captured calls to a file. They may contain org data — handle it accordingly.">Export</button>
      </div>
    </header>

    <div class="split">
      <div id="log-list" class="log-list"></div>
      <div id="log-detail" class="log-detail"></div>
    </div>
  </section>

  <div id="help-overlay" class="help-overlay" hidden>
    <div class="help-card" role="dialog" aria-label="Help">
      <button id="help-close" class="icon-btn tiny help-close" title="Close (Esc)">✕</button>
      <div id="help-body"></div>
    </div>
  </div>

  <footer class="status">
    <span id="status-left">Waiting for the first read…</span>
    <span id="status-right"></span>
    <span class="disclaimer">Unofficial tool · not affiliated with Salesforce</span>
  </footer>

  <!-- Real ES modules: app.js imports everything it needs (src/ui/*, which in
       turn imports src/core/*), so the browser's module graph resolves the
       load order instead of this list having to get it right by hand. -->
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
